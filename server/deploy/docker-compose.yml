# dev 环境一键起依赖（MySQL + Redis）
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: shinepick-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: shinepick
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7
    container_name: shinepick-redis
    ports:
      - "6379:6379"
volumes:
  mysql_data:
