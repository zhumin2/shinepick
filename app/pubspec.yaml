name: shinepick
description: 拾光 ShinePick - 记录正向日常的社交 App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 网络
  dio: ^5.4.0
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 状态管理
  provider: ^6.1.1
  # 路由
  go_router: ^13.2.0
  file_picker: ^13.3.0
  image: ^4.12.0
  # 图片保存到相册（Android/iOS）
  gal: ^2.3.0
  # Web 端浏览器 API（图片下载）
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
